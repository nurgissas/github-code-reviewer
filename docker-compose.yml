version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: code-reviewer-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    image: pgvector/pgvector:pg16
    container_name: code-reviewer-postgres
    environment:
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: code_reviewer
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewer']
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: code-reviewer-app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=
      - DATABASE_URL=postgresql://reviewer:password123@postgres:5432/code_reviewer
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: node dist/main.js

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: code-reviewer-agent
    ports:
      - '8000:8000'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql+asyncpg://reviewer:password123@postgres:5432/code_reviewer
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  postgres-data:
